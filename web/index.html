<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Scolaris — Savoir, Héritage, Avenir">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Scolaris">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Scolaris</title>
  <link rel="manifest" href="manifest.json">

  <!-- SPA redirect handler for GitHub Pages 404 workaround -->
  <script>
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #3E1A00;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3E1A00 0%, #8B1A00 100%);
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading-screen .logo-wrap {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(193,127,36,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-family: sans-serif;
      color: white;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }
    #loading-screen .app-name {
      color: white;
      font-size: 24px;
      font-weight: 800;
      font-family: sans-serif;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    #loading-screen .app-tag {
      color: rgba(193,127,36,0.85);
      font-size: 12px;
      font-style: italic;
      font-family: sans-serif;
      margin-bottom: 36px;
    }
    #loading-screen .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="logo-wrap">S</div>
    <div class="app-name">Scolaris</div>
    <div class="app-tag">Savoir, Héritage, Avenir</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading-screen');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
