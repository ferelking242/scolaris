name: scolaris
description: "Scolaris - Savoir, Héritage, Avenir."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  intl: any

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Theme
  flex_color_scheme: 8.2.0

  # Bulletins : PDF A4 + impression directe (Windows, Android, iOS, web).
  # `printing` ouvre la boîte de dialogue d'impression du système — pas
  # d'export-puis-ouvrir : le bulletin part à l'imprimante depuis l'app.
  pdf: ^3.11.1
  printing: ^5.13.4

  # Responsive
  flutter_screenutil: ^5.9.3
  responsive_framework: ^1.5.1

  # Mobile UI
  animations: ^2.0.11
  salomon_bottom_bar: ^3.3.2

  # Data viz
  fl_chart: ^0.69.0
  syncfusion_flutter_datagrid: ^27.1.48

  # UI kit
  lottie: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_popup: ^3.3.9

  # Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Localization
  easy_localization: ^3.0.7

  # Supabase
  supabase_flutter: ^2.6.0

  # Skeleton / shimmer loading
  skeletonizer: ^2.1.3

  # Utils
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.0
  collection: ^1.18.0
  equatable: ^2.0.5

  # UI premium — ForUI (shadcn/radix pour Flutter) — max 0.14.x pour Dart 3.8
  forui: ^0.14.1

  # URL launcher
  url_launcher: ^6.3.0
  image_picker: 1.1.2
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/lottie/

# Icône d'app générée depuis le logo Scolaris (assets/images/logo.png) pour
# Android/iOS/Windows/macOS/Web — remplace l'icône Flutter par défaut.
# Régénérer après tout changement de logo : `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#8B1A00"
  adaptive_icon_foreground: "assets/images/logo_transparent.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#8B1A00"
    theme_color: "#8B1A00"
